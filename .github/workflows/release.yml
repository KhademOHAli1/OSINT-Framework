name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run tests
      run: |
        cd frontend
        npm run lint
        npx vue-tsc --noEmit
        
    - name: Build for production
      run: |
        cd frontend
        npm run build
        
    - name: Create changelog
      id: changelog
      run: |
        previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        if [[ -n "$previous_tag" ]]; then
          git log "$previous_tag"..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_ENV
        else
          git log HEAD --pretty=format:"- %s (%h)" >> $GITHUB_ENV
        fi
        echo "" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
    - name: Create Release Archive
      run: |
        tar -czf osint-framework-${{ github.ref_name }}.tar.gz -C dist .
        
    - name: Create GitHub release and upload archive
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        name: OSINT Framework ${{ github.ref_name }}
        files: osint-framework-${{ github.ref_name }}.tar.gz
        body: |
          ## 🚀 What's New in ${{ github.ref_name }}
          
          ${{ env.CHANGELOG }}
          
          ## 📦 Installation
          
          ### Option 1: Download Release
          Download the `osint-framework-${{ github.ref_name }}.tar.gz` file and extract it to a web server.
          
          ### Option 2: Clone Repository
          ```bash
          git clone https://github.com/${{ github.repository }}.git
          cd OSINT-Framework
          npm install:all
          npm run build
          ```
          
          ### Option 3: Use GitHub Pages
          Visit the live version at: https://${{ github.repository_owner }}.github.io/OSINT-Framework
          
          ## 🔧 Development
          
          ```bash
          git clone https://github.com/${{ github.repository }}.git
          cd OSINT-Framework
          npm install:all
          npm run dev
          ```
          
          ## 📋 Full Changelog
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v2.0.0...${{ github.ref_name }}
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        tag_name: ${{ github.ref_name }}
        tag_message: 'Release ${{ github.ref_name }}'
